name: Verify MOXA with PySide6 6.11.2
on:
  push:
    branches: [pyside6-6.11.2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - run: >-
          python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --dest wheels -r requirements.txt
      - run: python -m pip install --no-index --find-links=wheels -r requirements.txt
      - run: python -m pip check
      - name: Open the MOXA interface
        shell: pwsh
        run: |
          @'
          from PySide6 import __version__
          from PySide6.QtWidgets import QApplication
          import main

          assert __version__ == '6.11.2'
          app = QApplication([])
          controller = main.Controller()
          controller.window.show()
          app.processEvents()
          assert controller.window.isVisible()
          assert controller.window.screens.count() == 3
          print('MOXA GUI started successfully with PySide6', __version__)
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: MOXA_wheels_6.11.2_win64_py312
          path: wheels/
          if-no-files-found: error
