name: MOXA Python regression checks

on:
  push:
    branches: [windows-exe]
    paths:
      - '**/*.py'
      - '**/*.ui'
      - '*.qss'
      - '.github/workflows/moxa-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moxa-regression-windows-exe
  cancel-in-progress: true

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install GUI runtime
        id: deps
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check PySide6==6.11.2
      - name: Python source compiles
        id: compile
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        run: python -m compileall -q main.py moxa_backend.py config_store.py network_discovery.py automation_timeline.py combined_timeline.py tests
      - name: Run live-control regression (mocked peer)
        id: live
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "ci-results" -Force | Out-Null
          python tests/verify_live_controls.py *> "ci-results/live-controls.txt"
          $result = $LASTEXITCODE
          Get-Content "ci-results/live-controls.txt"
          exit $result
      - name: Run opt-in simulator regression (offline)
        id: simulator
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "ci-results" -Force | Out-Null
          python tests/verify_simulation_opt_in.py *> "ci-results/simulation.txt"
          $result = $LASTEXITCODE
          Get-Content "ci-results/simulation.txt"
          exit $result
      - name: Publish concise result in repository
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "ci-results" -Force | Out-Null
          $report = @(
            "commit=${{ github.sha }}"
            "runtime=Windows Python 3.12 x64"
            "dependencies=${{ steps.deps.outcome }}"
            "syntax=${{ steps.compile.outcome }}"
            "live_controls=${{ steps.live.outcome }}"
            "simulation=${{ steps.simulator.outcome }}"
          )
          $report | Set-Content -Path "ci-results/windows-exe-last-run.txt" -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record MOXA regression results [skip ci]"
            git fetch origin windows-exe
            git rebase origin/windows-exe
            git push origin HEAD:windows-exe
          }
