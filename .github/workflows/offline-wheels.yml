name: MOXA offline wheels
on:
  push:
    branches: [offline-wheel-bundle]
    paths: [.github/workflows/offline-wheels.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.6'
          architecture: x64
      - run: >-
          python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --dest wheels -r requirements.txt
      - run: python -m pip install --no-index --find-links=wheels -r requirements.txt
      - run: python -c "from PySide6 import QtWidgets"
      - uses: actions/upload-artifact@v4
        with:
          name: MOXA_wheels_win64_py312
          path: |
            wheels/
            requirements.txt
            INSTALL_OFFLINE.cmd
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pyside6
          path: wheels/pyside6-*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pyside6_addons
          path: wheels/pyside6_addons-*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pyside6_essentials
          path: wheels/pyside6_essentials-*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pyside6_pdf
          path: wheels/pyside6_pdf-*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pyside6_webengine
          path: wheels/pyside6_webengine-*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: shiboken6
          path: wheels/shiboken6-*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: INSTALL_OFFLINE
          path: INSTALL_OFFLINE.cmd
          if-no-files-found: error
